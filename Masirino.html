<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مسیرینو | Masirino</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --panel: rgba(14, 20, 32, 0.92);
  --surface: #151c2c;
  --surface2: #1c2538;
  --border: rgba(255,255,255,0.08);
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.2);
  --green: #22c55e;
  --orange: #f59e0b;
  --red: #ef4444;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --radius: 16px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: 'Vazirmatn', system-ui, sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; font-family:var(--font); background:var(--bg); color:var(--text); }
#app { width:100%; height:100%; max-width:480px; margin:0 auto; position:relative; display:flex; flex-direction:column; }

/* Map */
#map { flex:1; width:100%; z-index:1; background:#0d1320; }
.leaflet-control-attribution { font-size:9px !important; background:rgba(0,0,0,0.5) !important; color:#888 !important; }
.leaflet-control-zoom { border:none !important; margin:12px !important; }
.leaflet-control-zoom a { background:var(--surface) !important; color:var(--text) !important; border:1px solid var(--border) !important; width:36px !important; height:36px !important; line-height:36px !important; font-size:16px !important; }
.leaflet-control-zoom a:first-child { border-radius:10px 10px 0 0 !important; }
.leaflet-control-zoom a:last-child { border-radius:0 0 10px 10px !important; }

/* Custom markers */
.marker-pin {
  width: 32px; height: 40px;
  display: flex; align-items: flex-start; justify-content: center;
}
.marker-pin span {
  width: 28px; height: 28px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  border: 2px solid #fff;
}
.marker-pin span i {
  transform: rotate(45deg); font-style: normal; font-size: 12px; color: #fff; font-weight: 700;
}
.pin-start span { background: var(--green); }
.pin-end span { background: var(--red); }
.pin-me span { background: var(--blue); width: 18px; height: 18px; border-radius: 50%; transform: none; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(59,130,246,0.3), 0 2px 8px rgba(0,0,0,0.3); }
.pin-me span i { display: none; }

/* Bottom control panel — compact */
#top {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
  padding: 0 10px calc(10px + var(--safe-b));
  pointer-events: none;
}
#top > * { pointer-events: auto; }
.brand {
  position: absolute; top: calc(8px + var(--safe-t)); left: 12px; right: 12px;
  z-index: 1000; display: flex; align-items: center; justify-content: space-between;
  pointer-events: none;
}
.brand-name {
  font-size: 14px; font-weight: 700; letter-spacing: -0.3px;
  display: flex; align-items: center; gap: 4px;
  background: rgba(14,20,32,0.75); backdrop-filter: blur(12px);
  padding: 5px 10px; border-radius: 10px; border: 1px solid var(--border);
  pointer-events: auto;
}
.brand-name span { color: var(--blue); }
.brand-badge {
  font-size: 9px; background: var(--blue-dim); color: var(--blue);
  padding: 2px 7px; border-radius: 7px; font-weight: 600;
  pointer-events: auto;
}

/* Search panel — compact bottom sheet style */
#search-panel {
  background: var(--panel);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: 18px 18px 14px 14px;
  padding: 8px;
  box-shadow: 0 -6px 28px rgba(0,0,0,0.4);
}
.search-row {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface);
  border-radius: 10px;
  padding: 0 8px;
  margin-bottom: 4px;
  border: 1px solid transparent;
  transition: border-color 0.2s;
}
.search-row:focus-within { border-color: var(--blue); }
.search-row .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot-start { background: var(--green); }
.dot-end { background: var(--red); }
.search-row input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 13px; font-family: var(--font);
  padding: 8px 2px; min-width: 0;
}
.search-row input::placeholder { color: var(--text3); }
.search-row .clear-btn {
  background: none; border: none; color: var(--text3); font-size: 14px;
  cursor: pointer; padding: 2px; display: none;
}
.search-row.has-val .clear-btn { display: block; }
.swap-btn {
  width: 26px; height: 26px; border-radius: 50%; border: none;
  background: var(--surface2); color: var(--text2); font-size: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin: -2px auto 2px; position: relative; z-index: 2;
}
.swap-btn:active { background: var(--blue-dim); color: var(--blue); }

/* Suggestions — open upward above panel */
#suggestions {
  display: none; max-height: 160px; overflow-y: auto;
  margin-bottom: 6px; border-radius: 10px; background: var(--surface);
  order: -1;
}
#suggestions.show { display: block; }
.sug-item {
  padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 8px;
}
.sug-item:last-child { border-bottom: none; }
.sug-item:active { background: var(--surface2); }
.sug-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; opacity: 0.7; }
.sug-text { flex: 1; min-width: 0; }
.sug-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sug-addr { font-size: 10.5px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Modes — compact row */
#modes {
  display: flex; gap: 4px; margin-top: 4px;
}
.mode-btn {
  flex: 1; padding: 5px 2px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); font-size: 10.5px; font-weight: 500;
  cursor: pointer; font-family: var(--font); display: flex; flex-direction: row;
  align-items: center; justify-content: center; gap: 3px; transition: all 0.2s;
}
.mode-btn .mi { font-size: 13px; }
.mode-btn active, .mode-btn.active {
  background: var(--blue-dim); border-color: var(--blue); color: var(--blue);
}

/* Action buttons */
#actions {
  display: flex; gap: 6px; margin-top: 6px;
}
.act-btn {
  flex: 1; padding: 9px; border-radius: 10px; border: none;
  font-size: 13px; font-weight: 600; font-family: var(--font);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: transform 0.1s, opacity 0.2s;
}
.act-btn:active { transform: scale(0.97); }
.act-btn:disabled { opacity: 0.4; pointer-events: none; }
.btn-route { background: var(--blue); color: #fff; }
.btn-locate { background: var(--surface2); color: var(--text); border: 1px solid var(--border); flex: 0 0 auto; padding: 9px 12px; }

/* Bottom sheet — route info */
#route-sheet {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
  background: var(--panel);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: 20px 20px 0 0;
  border: 1px solid var(--border);
  border-bottom: none;
  padding: 12px 16px calc(16px + var(--safe-b));
  transform: translateY(110%);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 45%;
  display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
}
#route-sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; background: rgba(255,255,255,0.2);
  border-radius: 2px; margin: 0 auto 12px;
}
.route-summary {
  display: flex; align-items: center; gap: 16px; margin-bottom: 12px;
}
.route-stat {
  text-align: center;
}
.route-stat .val {
  font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2;
}
.route-stat .lbl {
  font-size: 11px; color: var(--text3); margin-top: 2px;
}
.route-divider {
  width: 1px; height: 36px; background: var(--border);
}
.route-steps {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  margin: 0 -4px;
}
.step {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 4px; border-bottom: 1px solid var(--border);
}
.step:last-child { border-bottom: none; }
.step-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--blue-dim); color: var(--blue);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.step-text { flex: 1; font-size: 13px; line-height: 1.45; color: var(--text2); }
.step-dist { font-size: 11px; color: var(--text3); flex-shrink: 0; margin-top: 2px; }

/* Loading */
#loading {
  position: absolute; inset: 0; z-index: 2000;
  background: rgba(10,14,23,0.7);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
}
#loading.show { display: flex; }
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { font-size: 13px; color: var(--text2); }

/* Toast */
#toast {
  position: absolute; bottom: calc(80px + var(--safe-b)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20,28,45,0.95); color: #fff;
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500;
  z-index: 3000; opacity: 0; transition: all 0.3s; pointer-events: none;
  border: 1px solid var(--border); white-space: nowrap; max-width: 90%;
  backdrop-filter: blur(12px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Pick-on-map mode */
#pick-banner {
  position: absolute; bottom: calc(24px + var(--safe-b)); left: 12px; right: 12px;
  z-index: 1500; display: none;
  background: rgba(14,20,32,0.95); backdrop-filter: blur(16px);
  border: 1px solid var(--blue); border-radius: 14px;
  padding: 12px 14px; align-items: center; gap: 10px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
}
#pick-banner.show { display: flex; }
#pick-banner .pb-text { flex: 1; font-size: 13px; font-weight: 500; line-height: 1.4; }
#pick-banner .pb-text b { color: var(--blue); }
#pick-banner .pb-cancel {
  background: var(--surface2); border: none; color: var(--text2);
  padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: var(--font); flex-shrink: 0;
}
.pick-btns { display: flex; gap: 4px; margin-top: 4px; }
.pick-btn {
  flex: 1; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); font-size: 10.5px; font-weight: 500;
  cursor: pointer; font-family: var(--font); display: flex; align-items: center;
  justify-content: center; gap: 3px;
}
.pick-btn:active { background: var(--surface2); }
.pick-btn.start-pick { border-color: rgba(34,197,94,0.4); color: var(--green); }
.pick-btn.end-pick { border-color: rgba(239,68,68,0.4); color: var(--red); }
body.picking-map #map { cursor: crosshair; }
body.picking-map #search-panel { opacity: 0.85; }

/* Close route */
.close-route {
  position: absolute; top: 12px; left: 12px;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--surface2); color: var(--text2); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* Start navigation button */
.btn-nav {
  width: 100%; margin-top: 10px; padding: 12px;
  border-radius: 12px; border: none;
  background: var(--green); color: #fff;
  font-size: 15px; font-weight: 700; font-family: var(--font);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-nav:active { transform: scale(0.98); }

/* Live navigation HUD */
#nav-hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 1600;
  padding: calc(10px + var(--safe-t)) 12px 0;
  display: none; flex-direction: column; gap: 8px;
  pointer-events: none;
}
#nav-hud.show { display: flex; }
#nav-hud > * { pointer-events: auto; }
.nav-card {
  background: rgba(14,20,32,0.95); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 14px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.nav-instruction {
  font-size: 17px; font-weight: 600; line-height: 1.35; margin-bottom: 6px;
}
.nav-meta {
  display: flex; gap: 16px; font-size: 13px; color: var(--text2);
}
.nav-meta b { color: var(--text); font-weight: 600; }
.nav-bottom {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 1600;
  padding: 0 12px calc(16px + var(--safe-b));
  display: none; gap: 8px;
}
.nav-bottom.show { display: flex; }
.nav-stop {
  flex: 1; padding: 14px; border-radius: 14px; border: none;
  background: var(--red); color: #fff; font-size: 14px; font-weight: 700;
  font-family: var(--font); cursor: pointer;
}
.nav-recenter {
  padding: 14px 18px; border-radius: 14px; border: 1px solid var(--border);
  background: rgba(14,20,32,0.95); color: var(--text); font-size: 14px;
  font-weight: 600; font-family: var(--font); cursor: pointer;
}

/* Car marker */
.car-marker {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s linear;
}
.car-marker .car-body {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--blue);
  border: 3px solid #fff;
  box-shadow: 0 0 0 4px rgba(59,130,246,0.35), 0 4px 12px rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

/* Arrival overlay */
#arrival {
  position: absolute; inset: 0; z-index: 4000;
  background: rgba(10,14,23,0.88); backdrop-filter: blur(12px);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 24px; text-align: center;
}
#arrival.show { display: flex; }
#arrival .arr-icon { font-size: 64px; animation: pulse 1s ease infinite; }
#arrival .arr-title { font-size: 26px; font-weight: 700; color: var(--green); }
#arrival .arr-sub { font-size: 14px; color: var(--text2); }
#arrival button {
  margin-top: 12px; padding: 12px 32px; border-radius: 14px; border: none;
  background: var(--blue); color: #fff; font-size: 15px; font-weight: 600;
  font-family: var(--font); cursor: pointer;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div class="brand">
    <div class="brand-name"><span>◆</span> مسیرینو</div>
    <div class="brand-badge">۱.۰</div>
  </div>

  <div id="top">
    <div id="search-panel">
      <div id="suggestions"></div>
      <div class="search-row" id="row-start">
        <div class="dot dot-start"></div>
        <input type="text" id="inp-start" placeholder="مبدأ..." autocomplete="off">
        <button class="clear-btn" onclick="clearField('start')">✕</button>
      </div>
      <button class="swap-btn" onclick="swapPoints()" title="جابجایی">⇅</button>
      <div class="search-row" id="row-end">
        <div class="dot dot-end"></div>
        <input type="text" id="inp-end" placeholder="مقصد..." autocomplete="off">
        <button class="clear-btn" onclick="clearField('end')">✕</button>
      </div>

      <div id="modes">
        <button class="mode-btn active" data-mode="driving" onclick="setMode('driving')"><span class="mi">🚗</span>خودرو</button>
        <button class="mode-btn" data-mode="foot" onclick="setMode('foot')"><span class="mi">🚶</span>پیاده</button>
        <button class="mode-btn" data-mode="cycling" onclick="setMode('cycling')"><span class="mi">🚲</span>دوچرخه</button>
      </div>

      <div class="pick-btns">
        <button class="pick-btn start-pick" onclick="startPickMode('start')">🟢 مبدأ روی نقشه</button>
        <button class="pick-btn end-pick" onclick="startPickMode('end')">🔴 مقصد روی نقشه</button>
      </div>

      <div id="actions">
        <button class="act-btn btn-locate" onclick="locateMe()" title="موقعیت من">📍</button>
        <button class="act-btn btn-route" id="btn-route" onclick="findRoute()" disabled>مسیریابی</button>
      </div>
    </div>
  </div>

  <div id="pick-banner">
    <div class="pb-text" id="pick-text">روی نقشه لمس کنید</div>
    <button class="pb-cancel" onclick="cancelPickMode()">انصراف</button>
  </div>

  <div id="route-sheet">
    <div class="sheet-handle"></div>
    <button class="close-route" onclick="closeRoute()">✕</button>
    <div class="route-summary">
      <div class="route-stat"><div class="val" id="r-dist">—</div><div class="lbl">مسافت</div></div>
      <div class="route-divider"></div>
      <div class="route-stat"><div class="val" id="r-time">—</div><div class="lbl">زمان تقریبی</div></div>
      <div class="route-divider"></div>
      <div class="route-stat"><div class="val" id="r-mode">🚗</div><div class="lbl">حالت</div></div>
    </div>
    <div class="route-steps" id="r-steps"></div>
    <button class="btn-nav" id="btn-start-nav" onclick="startNavigation()">▶ شروع ناوبری</button>
  </div>

  <!-- Live navigation HUD -->
  <div id="nav-hud">
    <div class="nav-card">
      <div class="nav-instruction" id="nav-instr">در حال حرکت...</div>
      <div class="nav-meta">
        <span>مانده: <b id="nav-remain-dist">—</b></span>
        <span>زمان: <b id="nav-remain-time">—</b></span>
        <span>سرعت: <b id="nav-speed">—</b></span>
      </div>
    </div>
  </div>
  <div class="nav-bottom" id="nav-bottom">
    <button class="nav-stop" onclick="stopNavigation()">⏹ پایان ناوبری</button>
    <button class="nav-recenter" onclick="recenterNav()">📍</button>
  </div>

  <!-- Arrival -->
  <div id="arrival">
    <div class="arr-icon">🎉</div>
    <div class="arr-title">به مقصد رسیدید</div>
    <div class="arr-sub">مسیر با موفقیت به پایان رسید</div>
    <button onclick="dismissArrival()">باشه</button>
  </div>

  <div id="loading"><div class="spinner"></div><p id="load-text">در حال مسیریابی...</p></div>
  <div id="toast"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══ مسیرینو — Advanced Navigator ═══ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, ms = 2500) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}

function showLoading(text) {
  $('#load-text').textContent = text || 'لطفاً صبر کنید...';
  $('#loading').classList.add('show');
}
function hideLoading() { $('#loading').classList.remove('show'); }

/* ── Map ── */
const map = L.map('map', {
  zoomControl: false,
  attributionControl: true
}).setView([35.6892, 51.3890], 12); // Tehran default

L.control.zoom({ position: 'topright' }).addTo(map);

// کاشی رایگان OpenStreetMap — بدون API Key
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19
}).addTo(map);

/* ── State ── */
let startPoint = null; // {lat, lon, name}
let endPoint = null;
let myLocation = null;
let currentMode = 'driving';
let routeLayer = null;
let startMarker = null;
let endMarker = null;
let meMarker = null;
let activeInput = null; // 'start' | 'end'
let searchTimer = null;

const MODE_ICONS = { driving: '🚗', foot: '🚶', cycling: '🚲' };
const MODE_LABELS = { driving: 'خودرو', foot: 'پیاده', cycling: 'دوچرخه' };
const OSRM_PROFILES = { driving: 'driving', foot: 'foot', cycling: 'cycling' };

/* ── Markers ── */
function makeIcon(type) {
  const cls = type === 'start' ? 'pin-start' : type === 'end' ? 'pin-end' : 'pin-me';
  const label = type === 'start' ? 'م' : type === 'end' ? 'مق' : '';
  return L.divIcon({
    className: '',
    html: `<div class="marker-pin ${cls}"><span><i>${label}</i></span></div>`,
    iconSize: [32, 40],
    iconAnchor: type === 'me' ? [9, 9] : [16, 40]
  });
}

function setStartMarker(lat, lon) {
  if (startMarker) map.removeLayer(startMarker);
  startMarker = L.marker([lat, lon], { icon: makeIcon('start') }).addTo(map);
}
function setEndMarker(lat, lon) {
  if (endMarker) map.removeLayer(endMarker);
  endMarker = L.marker([lat, lon], { icon: makeIcon('end') }).addTo(map);
}
function setMeMarker(lat, lon) {
  if (meMarker) map.removeLayer(meMarker);
  meMarker = L.marker([lat, lon], { icon: makeIcon('me') }).addTo(map);
}

/* ── Search ── */
function bindSearch(inputId, which) {
  const inp = $(inputId);
  const row = $(`#row-${which}`);

  inp.addEventListener('focus', () => { activeInput = which; });
  inp.addEventListener('input', () => {
    row.classList.toggle('has-val', inp.value.trim().length > 0);
    clearTimeout(searchTimer);
    const q = inp.value.trim();
    if (q.length < 2) { hideSuggestions(); return; }
    searchTimer = setTimeout(() => searchPlaces(q), 350);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const first = $('#suggestions .sug-item');
      if (first) first.click();
    }
  });
}
bindSearch('#inp-start', 'start');
bindSearch('#inp-end', 'end');

function clearField(which) {
  if (which === 'start') {
    startPoint = null;
    $('#inp-start').value = '';
    $('#row-start').classList.remove('has-val');
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
  } else {
    endPoint = null;
    $('#inp-end').value = '';
    $('#row-end').classList.remove('has-val');
    if (endMarker) { map.removeLayer(endMarker); endMarker = null; }
  }
  hideSuggestions();
  updateRouteBtn();
  closeRoute();
}

function hideSuggestions() { $('#suggestions').classList.remove('show'); $('#suggestions').innerHTML = ''; }

async function searchPlaces(query) {
  try {
    // Prefer Iran-focused results; fallback global
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=6&accept-language=fa&countrycodes=ir`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'fa' } });
    let data = await res.json();

    // If few results in Iran, search globally
    if (data.length < 2) {
      const res2 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=6&accept-language=fa`);
      data = await res2.json();
    }

    if (!data.length) {
      $('#suggestions').innerHTML = '<div class="sug-item"><div class="sug-text"><div class="sug-name">نتیجه‌ای یافت نشد</div></div></div>';
      $('#suggestions').classList.add('show');
      return;
    }

    $('#suggestions').innerHTML = data.map(item => {
      const name = item.display_name.split(',')[0];
      const addr = item.display_name;
      return `<div class="sug-item" data-lat="${item.lat}" data-lon="${item.lon}" data-name="${escapeAttr(item.display_name)}">
        <div class="sug-icon">📍</div>
        <div class="sug-text">
          <div class="sug-name">${escapeHtml(name)}</div>
          <div class="sug-addr">${escapeHtml(addr)}</div>
        </div>
      </div>`;
    }).join('');
    $('#suggestions').classList.add('show');

    $$('#suggestions .sug-item').forEach(el => {
      el.addEventListener('click', () => {
        const lat = parseFloat(el.dataset.lat);
        const lon = parseFloat(el.dataset.lon);
        const name = el.dataset.name;
        selectPoint(activeInput || 'end', lat, lon, name);
      });
    });
  } catch (e) {
    toast('خطا در جستجو — اتصال اینترنت را بررسی کنید');
  }
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function selectPoint(which, lat, lon, name) {
  hideSuggestions();
  const short = name.length > 50 ? name.slice(0, 48) + '…' : name;

  if (which === 'start') {
    startPoint = { lat, lon, name };
    $('#inp-start').value = short;
    $('#row-start').classList.add('has-val');
    setStartMarker(lat, lon);
  } else {
    endPoint = { lat, lon, name };
    $('#inp-end').value = short;
    $('#row-end').classList.add('has-val');
    setEndMarker(lat, lon);
  }

  map.setView([lat, lon], Math.max(map.getZoom(), 14));
  updateRouteBtn();

  // Auto-route if both set
  if (startPoint && endPoint) {
    setTimeout(findRoute, 300);
  }
}

function updateRouteBtn() {
  $('#btn-route').disabled = !(startPoint && endPoint);
}

function swapPoints() {
  const tmp = startPoint;
  startPoint = endPoint;
  endPoint = tmp;

  const sVal = $('#inp-start').value;
  $('#inp-start').value = $('#inp-end').value;
  $('#inp-end').value = sVal;

  $('#row-start').classList.toggle('has-val', !!$('#inp-start').value);
  $('#row-end').classList.toggle('has-val', !!$('#inp-end').value);

  if (startPoint) setStartMarker(startPoint.lat, startPoint.lon);
  else if (startMarker) { map.removeLayer(startMarker); startMarker = null; }

  if (endPoint) setEndMarker(endPoint.lat, endPoint.lon);
  else if (endMarker) { map.removeLayer(endMarker); endMarker = null; }

  updateRouteBtn();
  if (startPoint && endPoint) findRoute();
}

/* ── Mode ── */
function setMode(mode) {
  currentMode = mode;
  $$('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (startPoint && endPoint) findRoute();
}

/* ── Geolocation ── */
function locateMe() {
  if (!navigator.geolocation) {
    toast('موقعیت‌یاب پشتیبانی نمی‌شود');
    return;
  }
  showLoading('در حال یافتن موقعیت شما...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      myLocation = { lat, lon };
      setMeMarker(lat, lon);
      map.setView([lat, lon], 15);

      // Reverse geocode for name
      let name = 'موقعیت فعلی شما';
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=fa`);
        const d = await r.json();
        if (d.display_name) name = d.display_name;
      } catch (_) {}

      selectPoint('start', lat, lon, name);
      hideLoading();
      toast('موقعیت شما پیدا شد');
    },
    err => {
      hideLoading();
      if (err.code === 1) toast('مجوز موقعیت رد شد');
      else if (err.code === 2) toast('موقعیت در دسترس نیست');
      else toast('خطا در دریافت موقعیت');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

/* ── Routing (OSRM) ── */
async function findRoute() {
  if (!startPoint || !endPoint) {
    toast('مبدأ و مقصد را مشخص کنید');
    return;
  }

  showLoading('در حال محاسبه مسیر...');
  closeRoute();

  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }

  const profile = OSRM_PROFILES[currentMode] || 'driving';
  const url = `https://router.project-osrm.org/route/v1/${profile}/${startPoint.lon},${startPoint.lat};${endPoint.lon},${endPoint.lat}?overview=full&geometries=geojson&steps=true&annotations=false`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.code !== 'Ok' || !data.routes?.length) {
      hideLoading();
      toast('مسیری یافت نشد');
      return;
    }

    const route = data.routes[0];
    const coords = route.geometry.coordinates.map(c => [c[1], c[0]]); // lon,lat → lat,lon

    routeLayer = L.polyline(coords, {
      color: '#3b82f6',
      weight: 5,
      opacity: 0.9,
      lineJoin: 'round'
    }).addTo(map);

    map.fitBounds(routeLayer.getBounds(), { padding: [80, 80, 200, 80] });

    // Summary
    const distKm = route.distance / 1000;
    const distStr = distKm < 1 ? Math.round(route.distance) + ' متر' : distKm.toFixed(1) + ' کیلومتر';
    const mins = Math.round(route.duration / 60);
    let timeStr;
    if (mins < 60) timeStr = mins + ' دقیقه';
    else timeStr = Math.floor(mins / 60) + ' ساعت و ' + (mins % 60) + ' دقیقه';

    $('#r-dist').textContent = distStr;
    $('#r-time').textContent = timeStr;
    $('#r-mode').textContent = MODE_ICONS[currentMode];

    // Steps
    const steps = [];
    for (const leg of route.legs) {
      for (const step of leg.steps) {
        if (step.maneuver.type === 'arrive') continue;
        const instruction = translateStep(step);
        const d = step.distance;
        const dStr = d < 1000 ? Math.round(d) + ' م' : (d / 1000).toFixed(1) + ' کم';
        if (instruction) steps.push({ text: instruction, dist: dStr });
      }
    }

    $('#r-steps').innerHTML = steps.map((s, i) => `
      <div class="step">
        <div class="step-num">${i + 1}</div>
        <div class="step-text">${s.text}</div>
        <div class="step-dist">${s.dist}</div>
      </div>
    `).join('') || '<div class="step"><div class="step-text">مسیر مستقیم</div></div>';

    $('#route-sheet').classList.add('open');
    hideLoading();
  } catch (e) {
    hideLoading();
    toast('خطا در مسیریابی — اتصال اینترنت را بررسی کنید');
    console.error(e);
  }
}

function translateStep(step) {
  const m = step.maneuver;
  const road = step.name || step.ref || '';
  const type = m.type;
  const mod = m.modifier || '';

  const dirMap = {
    left: 'چپ', right: 'راست', straight: 'مستقیم',
    'slight left': 'کمی به چپ', 'slight right': 'کمی به راست',
    'sharp left': 'پیچ تند به چپ', 'sharp right': 'پیچ تند به راست',
    uturn: 'دور بزنید'
  };

  if (type === 'depart') return road ? `حرکت از ${road}` : 'شروع مسیر';
  if (type === 'arrive') return 'رسیدن به مقصد';
  if (type === 'roundabout' || type === 'rotary') {
    return road ? `وارد میدان شوید و به سمت ${road}` : 'وارد میدان شوید';
  }
  if (type === 'turn' || type === 'end of road' || type === 'fork' || type === 'off ramp' || type === 'on ramp') {
    const d = dirMap[mod] || mod;
    return road ? `به ${d} بپیچید به سمت ${road}` : `به ${d} بپیچید`;
  }
  if (type === 'new name' || type === 'continue') {
    return road ? `ادامه در ${road}` : 'به مسیر ادامه دهید';
  }
  if (type === 'merge') return road ? `ادغام به ${road}` : 'ادغام در مسیر';
  if (mod) {
    const d = dirMap[mod] || mod;
    return road ? `${d} — ${road}` : d;
  }
  return road || 'ادامه مسیر';
}

function closeRoute() {
  $('#route-sheet').classList.remove('open');
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  stopNavigation();
}

/* ═══ Live Navigation ═══ */
let navActive = false;
let watchId = null;
let carMarker = null;
let lastPos = null;
let lastBearing = 0;
let routeCoords = []; // [[lat,lon], ...]
let arrivedFlag = false;
const ARRIVAL_RADIUS_M = 40; // meters

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function playDing() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // Ding 1
    const o1 = ctx.createOscillator();
    const g1 = ctx.createGain();
    o1.type = 'sine'; o1.frequency.value = 880;
    g1.gain.setValueAtTime(0.35, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    o1.connect(g1); g1.connect(ctx.destination);
    o1.start(now); o1.stop(now + 0.4);
    // Ding 2
    const o2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    o2.type = 'sine'; o2.frequency.value = 1174;
    g2.gain.setValueAtTime(0.3, now + 0.2);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(now + 0.2); o2.stop(now + 0.7);
    // Ding 3
    const o3 = ctx.createOscillator();
    const g3 = ctx.createGain();
    o3.type = 'sine'; o3.frequency.value = 1318;
    g3.gain.setValueAtTime(0.25, now + 0.4);
    g3.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    o3.connect(g3); g3.connect(ctx.destination);
    o3.start(now + 0.4); o3.stop(now + 1.0);
  } catch (e) { console.warn('Audio failed', e); }
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
}

function makeCarIcon(deg) {
  return L.divIcon({
    className: '',
    html: `<div class="car-marker" style="transform:rotate(${deg}deg)"><div class="car-body">▲</div></div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18]
  });
}

function startNavigation() {
  if (!endPoint) { toast('مقصد مشخص نیست'); return; }
  if (!navigator.geolocation) { toast('موقعیت‌یاب در دسترس نیست'); return; }

  arrivedFlag = false;
  lastPos = null;
  lastBearing = 0;

  // Hide search, show HUD
  $('#top').style.display = 'none';
  $('#route-sheet').classList.remove('open');
  $('#nav-hud').classList.add('show');
  $('#nav-bottom').classList.add('show');
  $('#nav-instr').textContent = 'در حال یافتن موقعیت شما...';
  showLoading('رفتن به موقعیت فعلی شما...');

  // اول موقعیت فعلی را بگیر، نقشه را روی ماشین ببر، بعد ردیابی را شروع کن
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      // مبدأ = همین‌جا
      startPoint = { lat, lon, name: 'موقعیت فعلی شما' };
      $('#inp-start').value = 'موقعیت فعلی شما';
      $('#row-start').classList.add('has-val');
      setStartMarker(lat, lon);
      setMeMarker(lat, lon);

      // ماشین را همین‌جا بگذار
      if (carMarker) map.removeLayer(carMarker);
      carMarker = L.marker([lat, lon], { icon: makeCarIcon(0), zIndexOffset: 1000 }).addTo(map);
      lastPos = { lat, lon };

      // زوم روی ماشین
      map.setView([lat, lon], 17, { animate: true });

      // مسیر را از همین نقطه تا مقصد دوباره حساب کن
      try {
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        const profile = OSRM_PROFILES[currentMode] || 'driving';
        const url = `https://router.project-osrm.org/route/v1/${profile}/${lon},${lat};${endPoint.lon},${endPoint.lat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes?.length) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          routeLayer = L.polyline(coords, {
            color: '#3b82f6', weight: 5, opacity: 0.9, lineJoin: 'round'
          }).addTo(map);
          routeCoords = coords;
          map.setView([lat, lon], 17);
        }
      } catch (e) {
        console.warn('re-route failed', e);
      }

      hideLoading();
      navActive = true;
      $('#nav-instr').textContent = 'ناوبری شروع شد — به مسیر ادامه دهید';

      // ردیابی پیوسته
      watchId = navigator.geolocation.watchPosition(
        onNavPosition,
        err => {
          toast(err.code === 1 ? 'مجوز موقعیت لازم است' : 'خطا در موقعیت‌یابی');
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );

      toast('ناوبری از موقعیت فعلی شروع شد');
    },
    err => {
      hideLoading();
      $('#nav-hud').classList.remove('show');
      $('#nav-bottom').classList.remove('show');
      $('#top').style.display = '';
      if (err.code === 1) toast('مجوز موقعیت رد شد — در تنظیمات مرورگر اجازه دهید');
      else toast('موقعیت دریافت نشد');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
  );
}

function onNavPosition(pos) {
  if (!navActive) return;
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const speed = pos.coords.speed; // m/s or null
  const accuracy = pos.coords.accuracy;

  // Bearing from movement
  let deg = lastBearing;
  if (lastPos) {
    const distMoved = haversine(lastPos.lat, lastPos.lon, lat, lon);
    if (distMoved > 3) {
      deg = bearing(lastPos.lat, lastPos.lon, lat, lon);
      lastBearing = deg;
    }
  }
  lastPos = { lat, lon };

  // Car marker
  if (carMarker) {
    carMarker.setLatLng([lat, lon]);
    carMarker.setIcon(makeCarIcon(deg));
  } else {
    carMarker = L.marker([lat, lon], { icon: makeCarIcon(deg), zIndexOffset: 1000 }).addTo(map);
  }

  // Follow camera
  map.setView([lat, lon], Math.max(map.getZoom(), 16), { animate: true });

  // Distance to destination
  const remainM = haversine(lat, lon, endPoint.lat, endPoint.lon);
  let distStr, timeStr;
  if (remainM < 1000) distStr = Math.round(remainM) + ' متر';
  else distStr = (remainM / 1000).toFixed(1) + ' کیلومتر';

  // ETA based on speed or default
  const spd = (speed && speed > 1) ? speed : 10; // fallback ~36 km/h
  const etaSec = remainM / spd;
  if (etaSec < 60) timeStr = Math.round(etaSec) + ' ثانیه';
  else if (etaSec < 3600) timeStr = Math.round(etaSec / 60) + ' دقیقه';
  else timeStr = Math.floor(etaSec / 3600) + 'س ' + Math.round((etaSec % 3600) / 60) + 'د';

  const speedKmh = speed != null && speed >= 0 ? Math.round(speed * 3.6) + ' km/h' : '—';

  $('#nav-remain-dist').textContent = distStr;
  $('#nav-remain-time').textContent = timeStr;
  $('#nav-speed').textContent = speedKmh;

  // Instruction text
  if (remainM > 200) {
    $('#nav-instr').textContent = 'به مسیر ادامه دهید — به سمت مقصد';
  } else if (remainM > ARRIVAL_RADIUS_M) {
    $('#nav-instr').textContent = 'نزدیک مقصد هستید';
  }

  // Arrival
  if (remainM <= ARRIVAL_RADIUS_M && !arrivedFlag) {
    arrivedFlag = true;
    onArrival();
  }
}

function onArrival() {
  playDing();
  $('#arrival').classList.add('show');
  $('#nav-instr').textContent = 'به مقصد رسیدید!';
  // Keep watching briefly then can stop
}

function dismissArrival() {
  $('#arrival').classList.remove('show');
  stopNavigation();
}

function stopNavigation() {
  navActive = false;
  arrivedFlag = false;
  if (watchId != null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  if (carMarker) {
    map.removeLayer(carMarker);
    carMarker = null;
  }
  lastPos = null;
  $('#nav-hud').classList.remove('show');
  $('#nav-bottom').classList.remove('show');
  $('#top').style.display = '';
  $('#arrival').classList.remove('show');
}

function recenterNav() {
  if (lastPos) map.setView([lastPos.lat, lastPos.lon], 17, { animate: true });
  else if (myLocation) map.setView([myLocation.lat, myLocation.lon], 17, { animate: true });
}

/* ── Pick origin/destination on map ── */
let pickMode = null; // 'start' | 'end' | null

function startPickMode(which) {
  pickMode = which;
  document.body.classList.add('picking-map');
  const label = which === 'start' ? 'مبدأ (نقطه سبز)' : 'مقصد (نقطه قرمز)';
  $('#pick-text').innerHTML = `روی نقشه بزنید تا <b>${label}</b> انتخاب شود`;
  $('#pick-banner').classList.add('show');
  toast(which === 'start' ? 'مبدأ را روی نقشه انتخاب کنید' : 'مقصد را روی نقشه انتخاب کنید');
  closeRoute();
  hideSuggestions();
}

function cancelPickMode() {
  pickMode = null;
  document.body.classList.remove('picking-map');
  $('#pick-banner').classList.remove('show');
}

function applyMapPoint(which, lat, lon) {
  const coordName = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  selectPoint(which, lat, lon, coordName);

  // Reverse geocode for readable name
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=fa`)
    .then(r => r.json())
    .then(d => {
      if (!d.display_name) return;
      const short = d.display_name.length > 50 ? d.display_name.slice(0, 48) + '…' : d.display_name;
      if (which === 'start' && startPoint) {
        startPoint.name = d.display_name;
        $('#inp-start').value = short;
      } else if (which === 'end' && endPoint) {
        endPoint.name = d.display_name;
        $('#inp-end').value = short;
      }
    }).catch(() => {});
}

map.on('click', e => {
  const lat = e.latlng.lat;
  const lon = e.latlng.lng;

  // Explicit pick mode from buttons
  if (pickMode) {
    const which = pickMode;
    cancelPickMode();
    applyMapPoint(which, lat, lon);
    toast(which === 'start' ? 'مبدأ انتخاب شد' : 'مقصد انتخاب شد');
    return;
  }

  // Default: first empty field, or end if both filled
  let which;
  if (!startPoint) which = 'start';
  else if (!endPoint) which = 'end';
  else which = 'end'; // replace destination

  applyMapPoint(which, lat, lon);
  toast(which === 'start' ? 'مبدأ از روی نقشه انتخاب شد' : 'مقصد از روی نقشه انتخاب شد');
});

/* ── Init: try locate ── */
setTimeout(() => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        myLocation = { lat, lon };
        setMeMarker(lat, lon);
        map.setView([lat, lon], 13);
      },
      () => {},
      { timeout: 8000, maximumAge: 120000 }
    );
  }
}, 500);
</script>
</body>
</html>
